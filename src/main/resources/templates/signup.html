<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원가입 · SAIPR</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head>
<body><main class="card"><p class="brand">SAIPR</p><h1>새 계정 만들기</h1><p class="muted">간단한 정보로 시작하세요.</p>
<form th:action="@{/signup}" th:object="${signupForm}" method="post">
<label for="name">이름</label><input id="name" th:field="*{name}" autocomplete="name" maxlength="50" required>
<p class="error" th:errors="*{name}" role="alert"></p>
<label for="email">이메일</label><input id="email" th:field="*{email}" type="email" autocomplete="username" maxlength="254" required>
<p class="error" th:errors="*{email}" role="alert"></p>
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-help" required>
<small id="password-help">8자 이상, UTF-8 기준 72바이트 이하</small>
<p class="error" th:errors="*{password}" role="alert"></p>
<label for="passwordConfirm">비밀번호 확인</label><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
<p class="error" th:errors="*{passwordConfirm}" role="alert"></p>
<button type="submit">회원가입</button></form>
<p class="footer">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
</main></body></html>
