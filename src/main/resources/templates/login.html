<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · SAIPR</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head>
<body><main class="card"><p class="brand">SAIPR</p><h1>다시 만나 반가워요</h1><p class="muted">이메일로 로그인하고 시작하세요.</p>
<p class="error" role="alert" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</p>
<p class="notice" role="status" th:if="${param.registered}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
<p class="notice" role="status" th:if="${param.logout}">로그아웃되었습니다.</p>
<form th:action="@{/login}" method="post">
<label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required autofocus>
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">로그인</button></form>
<p class="footer">아직 계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
</main></body></html>
