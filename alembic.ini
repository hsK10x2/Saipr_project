[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
# DB URL comes from app.core.config.Settings (DATABASE_URL env var).
# Keep this file ASCII-only: configparser uses the OS locale encoding on Windows.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
